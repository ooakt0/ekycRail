server:
  port: 8080
  servlet:
    context-path: /
  shutdown: graceful

spring:
  application:
    name: ekyc-rail
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

nagarik:
  base-url: ${NAGARIK_BASE_URL:https://api.nagarikapp.gov.np}
  verify-path: ${NAGARIK_VERIFY_PATH:/v1/identity/verify}
  connect-timeout-ms: ${NAGARIK_CONNECT_TIMEOUT_MS:1500}
  response-timeout-ms: ${NAGARIK_RESPONSE_TIMEOUT_MS:2500}

security:
  jwt:
    issuer: ${JWT_ISSUER:ekyc-rail}
    ttl-seconds: ${JWT_TTL_SECONDS:300}
    audience: ${JWT_AUDIENCE:ekyc-rail-client}

# Logging configuration
logging:
  level:
    root: WARN
    com.ekycrail: INFO
    org.springframework.web: INFO
    org.springframework.boot: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc OpenAPI (Swagger) configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

